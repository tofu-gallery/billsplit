allowBuilds:
  autoevals: true
  # Tofu (2026-10-30): not built. Only evalite, the dev-only eval tool, uses it, and this copy never loads it.
  # better-sqlite3 11.10.0 does not compile against Node 26's V8 (the default Node of a new Vercel project since
  # 2026-10-29), which stops the install when pnpm 10.26 or later reads this key.
  better-sqlite3: false
  braintrust: true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1094.0'
  - '@aws-sdk/s3-presigned-post@3.1094.0'
  - '@aws-sdk/s3-request-presigner@3.1094.0'
overrides:
  fast-uri: 3.1.9
  picomatch: 4.0.5
  postcss: 8.5.22
  sharp: 0.35.5
  vite@6: ^6.4.4
